name: tests
on:
  push:
    paths: ['MIZN/**']
  pull_request:
    paths: ['MIZN/**']
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MIZN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[test]
      - run: pytest -q
